server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/tutorlyn
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
app:
    jwtSecret: ${JWT_SECRET}
    accessTokenCookie: ${ACCESS_TOKEN_COOKIE}
    accessTokenExpirationMs: ${JWT_EXPIRATION_MS}
    refreshTokenCookie: ${REFRESH_TOKEN_COOKIE}
    refreshTokenExpirationMs: ${REFRESH_TOKEN_EXPIRATION_MS}